<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사람소리 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="person-sound">

<div class="page page--detail" id="person-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="person-sidebar" aria-label="사람소리 사이드바">

    <!-- 고정 상단 헤더: 아치 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="person-header">
      <!-- 90*90 사이즈 이미지 (사람 심볼: 아치 머리 + 반원 몸통) -->
      <a href="/main.html" class="detail-sidebar__icon" id="person-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <!-- 아치 머리 (화이트) -->
          <path fill="#ffffff" d="M88,170 L88,88 A82,82 0 0 1 252,88 L252,170 Z"/>
          <!-- 반원 몸통 (화이트) -->
          <path fill="#ffffff" d="M26,338 Q26,190 170,190 Q314,190 314,338 Z"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 사람소리 -->
      <h1 class="detail-sidebar__title" id="person-title">사람소리</h1>

      <!-- 설명 문구 -->
      <p class="detail-sidebar__desc" id="person-desc">사람의 입과 목소리에서 우러나는 다채로운 소리</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="person-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="person-scroll-area">
        <div class="detail-sidebar__groups" id="person-groups">

          <!-- 1. 깔깔 계열 (n = 1 ~ 3) -->
          <section class="word-group" id="group-kkal" data-group="kkal">
            <h2 class="word-group__title" role="button" tabindex="0">깔깔 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="깔깔" data-index="1" data-path="assets/People/1.gif" data-group="kkal">깔깔</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="낄낄" data-index="2" data-path="assets/People/2.gif" data-group="kkal">낄낄</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="껄껄" data-index="3" data-path="assets/People/3.gif" data-group="kkal">껄껄</button>
              </div>
            </div>
          </section>

          <!-- 2. 칼락칼락 계열 (n = 4 ~ 6) -->
          <section class="word-group" id="group-kollok" data-group="kollok">
            <h2 class="word-group__title" role="button" tabindex="0">칼락칼락 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="칼락칼락" data-index="4" data-path="assets/People/4.gif" data-group="kollok">칼락칼락</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="콜록콜록" data-index="5" data-path="assets/People/5.gif" data-group="kollok">콜록콜록</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="쿨럭쿨럭" data-index="6" data-path="assets/People/6.gif" data-group="kollok">쿨럭쿨럭</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="person-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="person-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="person-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="person-meaning-text">목청을 돋우어 맑고 높게 호쾌하게 웃는 소리</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="person-stage">
      <div class="detail-stage-media" id="person-stage-media">
        <img class="detail-stage-gif" id="person-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="person-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="person-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="person-placeholder-path">assets/People/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="person-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="person-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
