<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모양·외형 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="shape">

<div class="page page--detail" id="shape-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="shape-sidebar" aria-label="모양·외형 사이드바">

    <!-- 고정 상단 헤더: 원+삼각형 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="shape-header">
      <!-- 90*90 사이즈 이미지 (모양/외형 심볼: 원 + 스트로크 삼각형, 잘림 방지 완벽 viewBox) -->
      <a href="/main.html" class="detail-sidebar__icon" id="shape-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="-25 -5 365 360" style="overflow: visible;" aria-hidden="true">
          <!-- 원 (화이트) -->
          <circle fill="#ffffff" cx="135" cy="155" r="150"/>
          <!-- 삼각형 (블랙 채움 + 화이트 스트로크) -->
          <polygon class="icon-dark-fill" fill="#000000" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"
                   points="205,134 320,334 90,334"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 모양·외형 -->
      <h1 class="detail-sidebar__title" id="shape-title">모양·외형</h1>

      <!-- 설명 문구 -->
      <p class="detail-sidebar__desc" id="shape-desc">사물과 몸짓의 굴곡, 생김새와 결을 담은 말</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="shape-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="shape-scroll-area">
        <div class="detail-sidebar__groups" id="shape-groups">

          <!-- 1. 고불고불 계열 (n = 1 ~ 4) -->
          <section class="word-group" id="group-gobul" data-group="gobul">
            <h2 class="word-group__title" role="button" tabindex="0">고불고불 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="고불고불" data-index="1" data-path="assets/Shape/1.gif" data-group="gobul">고불고불</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="구불구불" data-index="2" data-path="assets/Shape/2.gif" data-group="gobul">구불구불</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="꼬불꼬불" data-index="3" data-path="assets/Shape/3.gif" data-group="gobul">꼬불꼬불</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="꾸불꾸불" data-index="4" data-path="assets/Shape/4.gif" data-group="gobul">꾸불꾸불</button>
              </div>
            </div>
          </section>

          <!-- 2. 보동보동 계열 (n = 5 ~ 8) -->
          <section class="word-group" id="group-bodong" data-group="bodong">
            <h2 class="word-group__title" role="button" tabindex="0">보동보동 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="보동보동" data-index="5" data-path="assets/Shape/5.gif" data-group="bodong">보동보동</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="부둥부둥" data-index="6" data-path="assets/Shape/6.gif" data-group="bodong">부둥부둥</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="포동포동" data-index="7" data-path="assets/Shape/7.gif" data-group="bodong">포동포동</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="푸둥푸둥" data-index="8" data-path="assets/Shape/8.gif" data-group="bodong">푸둥푸둥</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="shape-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="shape-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="shape-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="shape-meaning-text">조금 잘고 둥글게 이리저리 굽어 있는 모양</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="shape-stage">
      <div class="detail-stage-media" id="shape-stage-media">
        <img class="detail-stage-gif" id="shape-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="shape-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="shape-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="shape-placeholder-path">assets/Shape/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="shape-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="shape-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
