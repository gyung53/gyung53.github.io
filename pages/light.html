<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빛·색깔 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="light">

<div class="page page--detail" id="light-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="light-sidebar" aria-label="빛·색깔 사이드바">

    <!-- 고정 상단 헤더: 전구+별 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="light-header">
      <!-- 90*90 사이즈 이미지 (빛/색깔 심볼: 전구 본체 + 중앙 반짝이는 별) -->
      <a href="/main.html" class="detail-sidebar__icon" id="light-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <!-- 큰 전구 유리구 본체 (화이트) -->
          <path fill="#ffffff"
                d="M170,16 C95,16 52,68 52,135 C52,188 86,222 108,244 C118,255 122,264 122,272 L218,272 C218,264 222,255 232,244 C254,222 288,188 288,135 C288,68 245,16 170,16 Z"/>
          <!-- 소켓 나사산 (화이트) -->
          <rect fill="#ffffff" x="116" y="278" width="108" height="18" rx="9"/>
          <rect fill="#ffffff" x="125" y="300" width="90" height="16" rx="8"/>
          <rect fill="#ffffff" x="136" y="320" width="68" height="14" rx="7"/>
          <!-- 전구알 중앙(170, 135)에 위치한 반짝이는 별 (블랙) -->
          <polygon class="icon-dark-fill" fill="#000000"
                   points="170,54 181,109 228,77 196,124 252,135 196,146 228,193 181,161 170,216 159,161 112,193 144,146 88,135 144,124 112,77 159,109"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 빛·색깔 -->
      <h1 class="detail-sidebar__title" id="light-title">빛·색깔</h1>

      <!-- 설명 문구 -->
      <p class="detail-sidebar__desc" id="light-desc">빛과 색이 품은 온기, 반짝임과 결을 담은 말</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="light-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="light-scroll-area">
        <div class="detail-sidebar__groups" id="light-groups">

          <!-- 1. 반짝반짝 계열 (n = 1 ~ 4) -->
          <section class="word-group" id="group-banjjak" data-group="banjjak">
            <h2 class="word-group__title" role="button" tabindex="0">반짝반짝 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="반짝반짝" data-index="1" data-path="assets/Light/1.gif" data-group="banjjak">반짝반짝</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="번쩍번쩍" data-index="2" data-path="assets/Light/2.gif" data-group="banjjak">번쩍번쩍</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="빤짝빤짝" data-index="3" data-path="assets/Light/3.gif" data-group="banjjak">빤짝빤짝</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="뻔쩍뻔쩍" data-index="4" data-path="assets/Light/4.gif" data-group="banjjak">뻔쩍뻔쩍</button>
              </div>
            </div>
          </section>

          <!-- 2. 노릇노릇 계열 (n = 5 ~ 8) -->
          <section class="word-group" id="group-noreut" data-group="noreut">
            <h2 class="word-group__title" role="button" tabindex="0">노릇노릇 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="노릇노릇" data-index="5" data-path="assets/Light/5.gif" data-group="noreut">노릇노릇</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="누릇누릇" data-index="6" data-path="assets/Light/6.gif" data-group="noreut">누릇누릇</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="노름노름" data-index="7" data-path="assets/Light/7.gif" data-group="noreut">노름노름</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="누름누름" data-index="8" data-path="assets/Light/8.gif" data-group="noreut">누름누름</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="light-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="light-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="light-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="light-meaning-text">작은 빛이 잠깐씩 잇따라 밝게 빛나는 모양</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="light-stage">
      <div class="detail-stage-media" id="light-stage-media">
        <img class="detail-stage-gif" id="light-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="light-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="light-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="light-placeholder-path">assets/Light/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="light-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="light-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
