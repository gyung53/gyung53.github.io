<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사물소리 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="object-sound">

<div class="page page--detail" id="object-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="object-sidebar" aria-label="사물소리 사이드바">

    <!-- 고정 상단 헤더: 헥사곤 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="object-header">
      <!-- 90*90 사이즈 이미지 (사물 심볼: 6개 헥사곤 팝아웃 + 중심 원) -->
      <a href="/main.html" class="detail-sidebar__icon" id="object-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <!-- 6개 헥사곤 (화이트) -->
          <polygon fill="#ffffff" points="310,218.5 282,267 226,267 198,218.5 226,170 282,170"/>
          <polygon fill="#ffffff" points="226,267 198,315.5 142,315.5 114,267 142,218.5 198,218.5"/>
          <polygon fill="#ffffff" points="142,218.5 114,267 58,267 30,218.5 58,170 114,170"/>
          <polygon fill="#ffffff" points="142,121.5 114,170 58,170 30,121.5 58,73 114,73"/>
          <polygon fill="#ffffff" points="226,73 198,121.5 142,121.5 114,73 142,24.5 198,24.5"/>
          <polygon fill="#ffffff" points="310,121.5 282,170 226,170 198,121.5 226,73 282,73"/>
          <!-- 중앙 서클 (화이트) -->
          <circle fill="#ffffff" cx="170" cy="170" r="28"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 사물소리 -->
      <h1 class="detail-sidebar__title" id="object-title">사물소리</h1>

      <!-- 설명 문구 -->
      <p class="detail-sidebar__desc" id="object-desc">사물이 부딪치고 스치며 내는 일상의 소리</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="object-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="object-scroll-area">
        <div class="detail-sidebar__groups" id="object-groups">

          <!-- 1. 잘각잘각 계열 (n = 1 ~ 4) -->
          <section class="word-group" id="group-jalgak" data-group="jalgak">
            <h2 class="word-group__title" role="button" tabindex="0">잘각잘각 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="잘각잘각" data-index="1" data-path="assets/Object/1.gif" data-group="jalgak">잘각잘각</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="절걱절걱" data-index="2" data-path="assets/Object/2.gif" data-group="jalgak">절걱절걱</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="찰칵찰칵" data-index="3" data-path="assets/Object/3.gif" data-group="jalgak">찰칵찰칵</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="철컥철컥" data-index="4" data-path="assets/Object/4.gif" data-group="jalgak">철컥철컥</button>
              </div>
            </div>
          </section>

          <!-- 2. 오르르 계열 (n = 5 ~ 8) -->
          <section class="word-group" id="group-oreureu" data-group="oreureu"
            data-note="이 계열은 뜻의 세기에 따라 오르르, 와르르, 워르르, 우르르 순으로 놓았다.&#10;굵기는 이 순서와 다르게 나타난다.">
            <h2 class="word-group__title" role="button" tabindex="0">오르르 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="오르르" data-index="5" data-path="assets/Object/5.gif" data-group="oreureu">오르르</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="와르르" data-index="6" data-path="assets/Object/6.gif" data-group="oreureu">와르르</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="워르르" data-index="7" data-path="assets/Object/7.gif" data-group="oreureu">워르르</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="우르르" data-index="8" data-path="assets/Object/8.gif" data-group="oreureu">우르르</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="object-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="object-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="object-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="object-meaning-text">얇거나 바삭한 물건이 가볍게 스치거나 썰리는 소리</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="object-stage">
      <div class="detail-stage-media" id="object-stage-media">
        <img class="detail-stage-gif" id="object-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="object-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="object-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="object-placeholder-path">assets/Object/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="object-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="object-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
