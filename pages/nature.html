<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자연 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="nature">

<div class="page page--detail" id="nature-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="nature-sidebar" aria-label="자연 사이드바">

    <!-- 고정 상단 헤더: 꽃 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="nature-header">
      <!-- 90*90 사이즈 이미지 (자연 심볼: 꽃잎 그래픽) -->
      <a href="/main.html" class="detail-sidebar__icon" id="nature-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <!-- 줄기 -->
          <image href="/assets/images/shapes/flowerLineWhite.png" xlink:href="/assets/images/shapes/flowerLineWhite.png"
                 x="145" y="100" width="50" height="220" preserveAspectRatio="xMidYMid meet"/>
          <!-- 왼쪽 잎 -->
          <image href="/assets/images/shapes/leapLeftWhite.png" xlink:href="/assets/images/shapes/leapLeftWhite.png"
                 x="60" y="180" width="100" height="90" preserveAspectRatio="xMidYMid meet"/>
          <!-- 오른쪽 잎 -->
          <image href="/assets/images/shapes/leapRightWhite.png" xlink:href="/assets/images/shapes/leapRightWhite.png"
                 x="180" y="180" width="100" height="90" preserveAspectRatio="xMidYMid meet"/>
          <!-- 꽃 머리 -->
          <image href="/assets/images/shapes/flowerWhite.png" xlink:href="/assets/images/shapes/flowerWhite.png"
                 x="90" y="0" width="160" height="160" preserveAspectRatio="xMidYMid meet"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 자연 -->
      <h1 class="detail-sidebar__title" id="nature-title">자연</h1>

      <!-- 설명 문구 -->
      <p class="detail-sidebar__desc" id="nature-desc">바람과 물 등 자연이 빚어내는 살아있는 소리</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="nature-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="nature-scroll-area">
        <div class="detail-sidebar__groups" id="nature-groups">

          <!-- 1. 솨솨 계열 (n = 1 ~ 4) -->
          <section class="word-group" id="group-swaswa" data-group="swaswa">
            <h2 class="word-group__title" role="button" tabindex="0">솨솨 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="솨솨" data-index="1" data-path="assets/Nature/1.gif" data-group="swaswa">솨솨</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="쏴쏴" data-index="2" data-path="assets/Nature/2.gif" data-group="swaswa">쏴쏴</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="쇄쇄" data-index="3" data-path="assets/Nature/3.gif" data-group="swaswa">쇄쇄</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="쐐쐐" data-index="4" data-path="assets/Nature/4.gif" data-group="swaswa">쐐쐐</button>
              </div>
            </div>
          </section>

          <!-- 2. 잘잘 계열 (n = 5 ~ 8) -->
          <section class="word-group" id="group-jaljal" data-group="jaljal">
            <h2 class="word-group__title" role="button" tabindex="0">잘잘 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="잘잘" data-index="5" data-path="assets/Nature/5.gif" data-group="jaljal">잘잘</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="줄줄" data-index="6" data-path="assets/Nature/6.gif" data-group="jaljal">줄줄</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="짤짤" data-index="7" data-path="assets/Nature/7.gif" data-group="jaljal">짤짤</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="쭐쭐" data-index="8" data-path="assets/Nature/8.gif" data-group="jaljal">쭐쭐</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="nature-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="nature-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="nature-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="nature-meaning-text">세찬 비나 바람이 나뭇가지 등을 세차게 스치며 내는 소리</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="nature-stage">
      <div class="detail-stage-media" id="nature-stage-media">
        <img class="detail-stage-gif" id="nature-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="nature-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="nature-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="nature-placeholder-path">assets/Nature/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="nature-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="nature-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
