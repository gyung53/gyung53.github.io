<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>표정·감정 — 소리결</title>

<!-- Pretendard (로컬 파일) / Apple SD Gothic Neo 는 맥 시스템 폰트 사용 -->
<link rel="stylesheet" href="/fonts/pretendard/pretendard.css">

<link rel="stylesheet" href="/css/reset.css">
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/common.css">
<link rel="stylesheet" href="/css/detail.css">
<link rel="stylesheet" href="/css/gyeol-pad.css">
<link rel="stylesheet" href="/css/compare.css">
<link rel="stylesheet" href="/css/group-note.css">
<link rel="stylesheet" href="/css/attract.css">
</head>
<body class="page page--detail" data-page="expression">

<div class="page page--detail" id="expression-page">

  <!-- 왼쪽: 520px 블랙 사이드바 (축소 시 240px & #555555) -->
  <aside class="detail-sidebar" id="expression-sidebar" aria-label="표정·감정 사이드바">

    <!-- 고정 상단 헤더: 하트 스마일 심볼, 타이포, 설명 -->
    <div class="detail-sidebar__header" id="expression-header">
      <!-- 90*90 사이즈 이미지 (표정/감정 호버 상태: 하트 눈 스마일 얼굴) -->
      <a href="/main.html" class="detail-sidebar__icon" id="expression-symbol" aria-label="메인 화면으로 이동" title="소리결 메인으로 돌아가기">
        <svg viewBox="0 0 340 340" aria-hidden="true">
          <!-- 1: 원형 얼굴 (화이트) -->
          <circle fill="#ffffff" cx="170" cy="170" r="162"/>
          <!-- 2: 왼쪽 하트 눈 (블랙) -->
          <path class="icon-dark-fill" fill="#000000"
                d="M112,185 C112,185 69,156 69,129 C69,114 81,105 94,105 C103,105 109,111 112,119 C115,111 121,105 130,105 C143,105 155,114 155,129 C155,156 112,185 112,185 Z"/>
          <!-- 3: 오른쪽 하트 눈 (블랙) -->
          <path class="icon-dark-fill" fill="#000000"
                d="M228,185 C228,185 185,156 185,129 C185,114 197,105 210,105 C219,105 225,111 228,119 C231,111 237,105 246,105 C259,105 271,114 271,129 C271,156 228,185 228,185 Z"/>
          <!-- 4: 웃는 입 라인 (블랙) -->
          <path class="icon-dark-stroke" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="round"
                d="M106,224 Q170,286 234,224"/>
        </svg>
      </a>

      <!-- 이미지로부터 46px 거리: 표정·감정 (Apple SD Gothic Neo Thin, 약 40pt, 자간 -5%, 행간 100%) -->
      <h1 class="detail-sidebar__title" id="expression-title">표정·감정</h1>

      <!-- 타이포로부터 12px 떨어진 곳: pretendard Regular 14pt 130% 한 줄 진행 -->
      <p class="detail-sidebar__desc" id="expression-desc">얼굴과 마음에 차오르는 감정의 미묘한 결을 담은 말</p>
    </div>

    <!-- 스크롤 가능 계열어 영역 (상·하단 블러 효과) -->
    <div class="detail-sidebar__scroll-container" id="expression-scroll-container">
      <div class="detail-sidebar__blur detail-sidebar__blur--top" aria-hidden="true"></div>

      <div class="detail-sidebar__scroll-area" id="expression-scroll-area">
        <div class="detail-sidebar__groups" id="expression-groups">

          <!-- 1. 상글상글 계열 (n = 1 ~ 4) -->
          <section class="word-group" id="group-sanggeul" data-group="sanggeul">
            <h2 class="word-group__title" role="button" tabindex="0">상글상글 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="상글상글" data-index="1" data-path="assets/Smile/1.gif" data-group="sanggeul">상글상글</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="싱글싱글" data-index="2" data-path="assets/Smile/2.gif" data-group="sanggeul">싱글싱글</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="쌍글쌍글" data-index="3" data-path="assets/Smile/3.gif" data-group="sanggeul">쌍글쌍글</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="씽글씽글" data-index="4" data-path="assets/Smile/4.gif" data-group="sanggeul">씽글씽글</button>
              </div>
            </div>
          </section>

          <!-- 2. 방긋방긋 계열 (n = 5 ~ 8) -->
          <section class="word-group" id="group-banggeut" data-group="banggeut">
            <h2 class="word-group__title" role="button" tabindex="0">방긋방긋 계열</h2>
            <div class="word-group__sub">
              <div class="word-line">
                <button type="button" class="word-chip" data-word="방긋방긋" data-index="5" data-path="assets/Smile/5.gif" data-group="banggeut">방긋방긋</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="벙긋벙긋" data-index="6" data-path="assets/Smile/6.gif" data-group="banggeut">벙긋벙긋</button>
              </div>
              <div class="word-line">
                <button type="button" class="word-chip" data-word="빵긋빵긋" data-index="7" data-path="assets/Smile/7.gif" data-group="banggeut">빵긋빵긋</button>
                <span class="word-slash">/</span>
                <button type="button" class="word-chip" data-word="뻥긋뻥긋" data-index="8" data-path="assets/Smile/8.gif" data-group="banggeut">뻥긋뻥긋</button>
              </div>
            </div>
          </section>

        </div>
      </div>

      <div class="detail-sidebar__blur detail-sidebar__blur--bottom" aria-hidden="true"></div>
    </div>
  </aside>

  <!-- 오른쪽: 화이트 메인 영역 (에셋 GIF / 뜻 / 하단 선택지) -->
  <main class="detail-main" id="expression-main" role="main">
    <!-- 초기 상태 안내 (계열어 선택 전) -->
    <div class="detail-initial-prompt" id="expression-initial-prompt">
      <p class="detail-initial-prompt__text">왼쪽의 계열어를 선택해보세요</p>
    </div>

    <!-- 우측 상단: 뜻 영역 (우측 정렬, top 100px, right 100px) -->
    <div class="detail-meaning" id="expression-meaning">
      <span class="detail-meaning__label">뜻</span>
      <span class="detail-meaning__divider">|</span>
      <span class="detail-meaning__text" id="expression-meaning-text">입술을 약간 벌리고 소리 없이 환하게 자꾸 웃는 모양</span>
    </div>

    <!-- 중앙: 에셋 미디어 스테이지 -->
    <div class="detail-main__stage" id="expression-stage">
      <div class="detail-stage-media" id="expression-stage-media">
        <img class="detail-stage-gif" id="expression-stage-gif" src="" alt="단어 비주얼" />
        <div class="detail-stage-fallback" id="expression-stage-fallback">
          <!-- GIF 로드 전/미등록 시 시안과 동일한 살구빛 플레이스홀더 -->
          <div class="detail-stage-placeholder" id="expression-stage-placeholder">
            <span class="detail-stage-placeholder__text">gif 들어갈 곳</span>
            <span class="detail-stage-placeholder__path" id="expression-placeholder-path">assets/Smile/1.gif</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 우측 하단: 가로 구분선 및 계열어 가로 선택지 -->
    <div class="detail-footer" id="expression-footer">
      <div class="detail-footer__divider" aria-hidden="true"></div>
      <div class="detail-footer__words" id="expression-footer-words" role="tablist" aria-label="계열어 선택지">
        <!-- JS로 동적 렌더링 -->
      </div>
    </div>
  </main>

</div>

<script src="/js/words-data.js"></script>
<script src="/js/common.js"></script>
<script src="/js/voice.js"></script>
<script src="/js/detail.js"></script>
<script src="/js/gyeol-pad.js"></script>
<script src="/js/compare.js"></script>
<script src="/js/gyeol-stats.js"></script>
<script src="/js/group-note.js"></script>
<script src="/js/attract.js"></script>
</body>
</html>
